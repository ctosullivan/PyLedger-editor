[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-editor"
version = "0.8.2"
requires-python = ">=3.8"
dependencies = [
    "textual==8.2.5",
    # PyLedger is installed from vendor/pyledger/ in editable mode (pip install -e vendor/pyledger/).
    # The PyPI 'pyledger' package is a stub only. See CONTRIBUTING.md for setup instructions.
    "PyLedger==0.5.0",
]

[project.scripts]
ledger-editor = "ledger_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
