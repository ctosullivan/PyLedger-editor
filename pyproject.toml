[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ledger-editor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual==8.2.5",
    "pyledger==0.5",
]

[project.scripts]
ledger-editor = "ledger_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
