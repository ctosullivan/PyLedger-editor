[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerkit-editor"
version = "0.9.5"
requires-python = ">=3.8"
dependencies = [
    "textual==8.2.5",
    # ledgerkit is installed from vendor/ledgerkit/ in editable mode (pip install -e vendor/ledgerkit/).
    # Always use the vendor version. See CONTRIBUTING.md for setup instructions.
    "ledgerkit==0.2.0",
]

[project.scripts]
ledgerkit-editor = "ledgerkit_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
